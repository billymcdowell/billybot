[package]
name = "billybot"
version = "0.1.1"
description = "A desktop AI coding agent harness built with Tauri and React"
authors = ["Billy McDowell"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "billybot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
keyring = "4"
whisper-rs = "0.16"
ignore = "0.4"
regex = "1"
tauri-plugin-notification = "~2.7"

# Metal is Apple-only; enabling it elsewhere makes CMake look for Apple frameworks.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Build whisper.cpp optimised even in dev builds; unoptimised it is far too slow.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

# Used by src/procgroup.rs to kill a command's whole process tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Dictation on Linux needs MediaStream switched on in WebKitGTK. Same version wry pins.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
